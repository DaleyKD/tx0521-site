name = "tx0521"
main = "./worker/index.js"
compatibility_date = "2026-09-09"

# We're not using per-version Preview URLs (no gradual/versioned deployments,
# and PR previews are handled by GitHub Actions, not Cloudflare's own branch
# builds) — disable explicitly rather than leaving it to the workers.dev default.
preview_urls = false

# Keep the *.workers.dev URL disabled. Without this explicit key, Wrangler
# defaults to workers_dev = true on every deploy, which silently re-enables
# the URL each time Cloudflare's git-integrated build redeploys main.
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"

[[kv_namespaces]]
binding = "CALENDAR_KV"
id = "e733ec4365334516b4a2564905376024"

# Sends contact-form emails via Cloudflare Email Routing (already configured
# on this zone). No destination_address restriction here on purpose — the
# actual recipient is the CONTACT_TO_ADDRESS secret (`wrangler secret put`),
# not committed to this file.
[[send_email]]
name = "CONTACT_EMAIL"

# Hostnames the contact form's Turnstile token is allowed to have been solved
# on, checked against siteverify's own "hostname" field server-side. Not
# secret — the widget's sitekey and allowed domains are public by design.
# Local dev adds localhost/127.0.0.1 via .dev.vars instead of here.
[vars]
TURNSTILE_HOSTNAMES = "tx0521.org,www.tx0521.org,tx0521.kyle-a96.workers.dev"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
